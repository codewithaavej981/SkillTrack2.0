<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <!-- Background Gradient for Icon Tile -->
    <linearGradient id="logoBg" x1="4" y1="4" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140f2d"/>
      <stop offset="50%" stop-color="#241952"/>
      <stop offset="100%" stop-color="#3d2780"/>
    </linearGradient>

    <!-- Core Ribbon / Momentum Arc -->
    <linearGradient id="logoArc" x1="12" y1="40" x2="40" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5046e5"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="85%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Foundation / Learning Book Wing -->
    <linearGradient id="logoPage" x1="12" y1="30" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Star Glow -->
    <filter id="logoGlow" x="26" y="4" width="24" height="24" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6956e7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Tile (48x48) -->
  <g transform="translate(4, 4)">
    <!-- Squircle Backdrop -->
    <rect x="0" y="0" width="48" height="48" rx="13" ry="13" fill="url(#logoBg)"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="12.5" ry="12.5" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>

    <!-- Learning Foundation / Open Pages Arc -->
    <path d="M11 34 C 17 31, 21 32, 24 36 C 27 32, 32 31, 38 34 C 36 37, 30 38.5, 24 38 C 18 38.5, 13 37, 11 34 Z" fill="url(#logoPage)"/>

    <!-- Ascending Skill 'S' Momentum Ribbon -->
    <path d="M14 28 C 13 21, 20 18, 26 19 C 32 20.5, 35 25, 33 29 C 31 33, 25 32, 21 31.5 C 19 31, 17 32, 16 33 C 14 30, 16 27, 20 27 C 25 26, 28 27.5, 29 25 C 30 23, 27 22, 24 21.5 C 19 21, 15 23.5, 14 28 Z" fill="url(#logoArc)"/>

    <!-- Upward Growth Arrow Path -->
    <path d="M20 34 L28 20 L33 22" stroke="url(#logoArc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Apex AI Quad Star -->
    <g filter="url(#logoGlow)">
      <path d="M36 8 C36 12, 38 14, 42 14 C38 14, 36 16, 36 20 C36 16, 34 14, 30 14 C34 14, 36 12, 36 8 Z" fill="#ffffff"/>
      <circle cx="36" cy="14" r="1.2" fill="#38bdf8"/>
    </g>

    <!-- Micro Satellite Spark -->
    <path d="M15 14 C15 16, 16 16.5, 17.5 16.5 C16 16.5, 15 17, 15 18.5 C15 17, 14 16.5, 12.5 16.5 C14 16.5, 15 16, 15 14 Z" fill="#a78bfa" opacity="0.9"/>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(62, 14)">
    <!-- Wordmark: SkillTracker -->
    <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1f1b2d" letter-spacing="-0.03em">SkillTracker</text>

    <!-- Pill Badge: AI 2.0 -->
    <g transform="translate(112, 4)">
      <rect x="0" y="0" width="46" height="19" rx="5" ry="5" fill="url(#badgeGrad)"/>
      <text x="23" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">AI 2.0</text>
    </g>
  </g>
</svg>
